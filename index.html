<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Movie Cluster Explorer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f7;color:#111;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#4B3FBF;padding:16px 28px;display:flex;align-items:center;gap:14px}
.logo-box{width:42px;height:42px;background:rgba(255,255,255,0.15);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px}
.topbar h1{color:#fff;font-size:20px;font-weight:600;margin-bottom:2px}
.topbar p{color:rgba(255,255,255,0.6);font-size:12px}
.body{display:flex;flex:1;gap:0;min-height:calc(100vh - 74px)}
.sidebar{width:240px;min-width:240px;background:#fff;border-right:1px solid #e5e7eb;padding:20px 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h3{font-size:13px;font-weight:600;margin-bottom:16px;color:#111}
.dist-row{margin-bottom:4px}
.dist-btn{width:100%;background:none;border:none;text-align:left;cursor:pointer;padding:8px 10px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;transition:background .15s}
.dist-btn:hover{background:#f0f0f5}
.dist-btn.active{background:#EEEDFE}
.dist-name{font-size:12px;color:#333;font-weight:500}
.dist-btn.active .dist-name{color:#3C3489}
.dist-pct{font-size:11px;color:#888}
.dist-btn.active .dist-pct{color:#7F77DD}
.bar-track{height:4px;background:#f0f0f0;border-radius:999px;overflow:hidden;margin:0 10px 6px}
.bar-fill{height:100%;border-radius:999px}
.main{flex:1;padding:20px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px 16px}
.metric-label{font-size:11px;color:#888;margin-bottom:4px}
.metric-val{font-size:22px;font-weight:600;color:#111}
.cluster-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden}
.cluster-header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background .15s}
.cluster-header:hover{background:#fafafa}
.cluster-num{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0}
.cluster-name{font-size:13px;font-weight:600;color:#111;margin-bottom:2px}
.cluster-meta{font-size:11px;color:#888}
.expand-icon{margin-left:auto;font-size:18px;color:#aaa;transition:transform .2s;flex-shrink:0}
.movies-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.movie-tile{padding:12px;border-right:1px solid #f0f0f0}
.movie-tile:last-child{border-right:none}
.poster{width:100%;aspect-ratio:2/3;border-radius:8px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;font-size:26px}
.movie-name{font-size:11px;font-weight:600;color:#111;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.movie-info{font-size:11px;color:#888}
.all-movies-panel{display:none;border-top:1px solid #f0f0f0;padding:16px;max-height:420px;overflow-y:auto}
.all-movies-panel.open{display:block}
.all-movies-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.all-movie-item{display:flex;flex-direction:column}
.all-poster{width:100%;aspect-ratio:2/3;border-radius:8px;margin-bottom:6px;display:flex;align-items:center;justify-content:center;font-size:22px}
.all-movie-name{font-size:11px;font-weight:600;color:#111;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.all-movie-info{font-size:10px;color:#888}
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.panel-title{font-size:13px;font-weight:600;color:#111}
.close-btn{background:none;border:none;font-size:18px;color:#aaa;cursor:pointer;padding:0 4px}
footer{padding:14px 28px;font-size:11px;color:#aaa;text-align:center;border-top:1px solid #e5e7eb;background:#fff}
footer a{color:#4B3FBF;text-decoration:none}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo-box">🎬</div>
  <div>
    <h1>Movie Clusters</h1>
    <p>Grouping movies by text similarity using K-Means clustering</p>
  </div>
</div>

<div class="body">
  <div class="sidebar">
    <h3>Cluster distribution</h3>
    <div id="sidebar-list"></div>
  </div>
  <div class="main">
    <div class="metrics">
      <div class="metric"><div class="metric-label">Total movies</div><div class="metric-val" id="m-total">—</div></div>
      <div class="metric"><div class="metric-label">Clusters</div><div class="metric-val" id="m-clusters">—</div></div>
      <div class="metric"><div class="metric-label">Avg rating</div><div class="metric-val" id="m-rating">—</div></div>
    </div>
    <div id="cluster-list"></div>
  </div>
</div>

<footer>
  Dataset: <a href="https://www.kaggle.com/datasets/tmdb/tmdb-movie-metadata" target="_blank">TMDB 5000 Movies</a>
  &nbsp;&middot;&nbsp; Built with scikit-learn &amp; Plotly
</footer>

<script>
const COLORS = [
  {bg:"#EEEDFE",text:"#3C3489",bar:"#7F77DD",label:"Action & Adventure"},
  {bg:"#FBEAF0",text:"#72243E",bar:"#D4537E",label:"Drama & Romance"},
  {bg:"#E6F1FB",text:"#0C447C",bar:"#378ADD",label:"Sci-Fi & Thriller"},
  {bg:"#E1F5EE",text:"#085041",bar:"#1D9E75",label:"Comedy"},
  {bg:"#FAECE7",text:"#712B13",bar:"#D85A30",label:"Horror & Mystery"},
  {bg:"#FAEEDA",text:"#633806",bar:"#BA7517",label:"Animation & Family"},
  {bg:"#F1EFE8",text:"#444441",bar:"#888780",label:"Documentary"},
  {bg:"#EAF3DE",text:"#27500A",bar:"#639922",label:"War & History"},
  {bg:"#EEEDFE",text:"#534AB7",bar:"#AFA9EC",label:"Cluster 8"},
  {bg:"#FBEAF0",text:"#993556",bar:"#ED93B1",label:"Cluster 9"},
  {bg:"#E6F1FB",text:"#185FA5",bar:"#85B7EB",label:"Cluster 10"},
  {bg:"#E1F5EE",text:"#0F6E56",bar:"#5DCAA5",label:"Cluster 11"},
  {bg:"#FAECE7",text:"#993C1D",bar:"#F0997B",label:"Cluster 12"},
  {bg:"#FAEEDA",text:"#854F0B",bar:"#EF9F27",label:"Cluster 13"},
  {bg:"#F1EFE8",text:"#5F5E5A",bar:"#B4B2A9",label:"Cluster 14"},
];

function parseCSV(text){
  const results = [];
  const lines = text.trim().split('\n');
  for(let i=0;i<lines.length;i++){
    const row = [];
    let cur = '', inQuote = false;
    for(let j=0;j<lines[i].length;j++){
      const ch = lines[i][j];
      if(ch==='"'){ inQuote=!inQuote; }
      else if(ch===','&&!inQuote){ row.push(cur.trim()); cur=''; }
      else { cur+=ch; }
    }
    row.push(cur.trim());
    results.push(row);
  }
  return results;
}

fetch('app_data/movies_clustered.csv')
  .then(r => r.text())
  .then(csv => {
    const rows    = parseCSV(csv);
    const headers = rows[0];
    const idx     = h => headers.indexOf(h);

    const movies = rows.slice(1)
      .filter(cols => cols.length >= headers.length - 1)
      .map(cols => ({
        title:   (cols[idx('title')]   ||'').replace(/^"|"$/g,'').trim(),
        overview:(cols[idx('overview')]||'').replace(/^"|"$/g,'').trim(),
        rating:  parseFloat(cols[idx('vote_average')]) || 0,
        year:    parseInt(cols[idx('year')])            || 0,
        cluster: parseInt(cols[idx('cluster')])         || 0,
        keywords:(cols[idx('cluster_keywords')]||'').replace(/^"|"$/g,'').trim(),
      }))
      .filter(m => !isNaN(m.cluster) && m.title);

    const K = Math.max(...movies.map(m => m.cluster)) + 1;
    const groups = {};
    for(let c=0;c<K;c++) groups[c] = movies.filter(m=>m.cluster===c).sort((a,b)=>b.rating-a.rating);

    const total = movies.length;
    const avgR  = (movies.reduce((s,m)=>s+m.rating,0)/total).toFixed(2);
    document.getElementById('m-total').textContent    = total.toLocaleString();
    document.getElementById('m-clusters').textContent = K;
    document.getElementById('m-rating').textContent   = avgR;

    const sidebarEl = document.getElementById('sidebar-list');
    for(let c=0;c<K;c++){
      const col   = COLORS[c % COLORS.length];
      const count = (groups[c]||[]).length;
      const pct   = Math.round(count/total*100);
      const wrap  = document.createElement('div');
      wrap.className = 'dist-row';
      wrap.innerHTML = `
        <button class="dist-btn" data-c="${c}" aria-label="Show cluster ${c}">
          <span class="dist-name">${col.label}</span>
          <span class="dist-pct">${count.toLocaleString()} (${pct}%)</span>
        </button>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max(pct,1)}%;background:${col.bar}"></div></div>`;
      sidebarEl.appendChild(wrap);
    }

    const listEl = document.getElementById('cluster-list');
    for(let c=0;c<K;c++){
      const col   = COLORS[c % COLORS.length];
      const grp   = groups[c] || [];
      if(grp.length === 0) continue;
      const avgGR = (grp.reduce((s,m)=>s+m.rating,0)/grp.length).toFixed(1);
      const kw    = (grp[0]?.keywords||'').split(',').slice(0,3).join(', ');
      const card  = document.createElement('div');
      card.className = 'cluster-card';
      card.id = `card-${c}`;

      const previewHTML = grp.slice(0,4).map(m=>`
        <div class="movie-tile">
          <div class="poster" style="background:${col.bg}">🎬</div>
          <div class="movie-name">${m.title}</div>
          <div class="movie-info">⭐ ${m.rating.toFixed(1)} · ${m.year||'—'}</div>
        </div>`).join('');

      const allHTML = grp.map(m=>`
        <div class="all-movie-item">
          <div class="all-poster" style="background:${col.bg}">🎬</div>
          <div class="all-movie-name">${m.title}</div>
          <div class="all-movie-info">⭐ ${m.rating.toFixed(1)} · ${m.year||'—'}</div>
        </div>`).join('');

      card.innerHTML = `
        <div class="cluster-header" data-c="${c}" role="button" tabindex="0" aria-expanded="false">
          <div class="cluster-num" style="background:${col.bg};color:${col.text}">${grp.length}</div>
          <div>
            <div class="cluster-name">${col.label}</div>
            <div class="cluster-meta">${grp.length.toLocaleString()} movies · avg ${avgGR} · ${kw}</div>
          </div>
          <span class="expand-icon">›</span>
        </div>
        <div class="movies-grid">${previewHTML}</div>
        <div class="all-movies-panel" id="panel-${c}">
          <div class="panel-header">
            <span class="panel-title">All movies in ${col.label}</span>
            <button class="close-btn" data-c="${c}" aria-label="Close panel">✕</button>
          </div>
          <div class="all-movies-grid">${allHTML}</div>
        </div>`;
      listEl.appendChild(card);
    }

    sidebarEl.addEventListener('click', e => {
      const btn = e.target.closest('.dist-btn');
      if(!btn) return;
      const c = btn.dataset.c;
      document.querySelectorAll('.dist-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`card-${c}`)?.scrollIntoView({behavior:'smooth',block:'start'});
    });

    listEl.addEventListener('click', e => {
      const closeBtn = e.target.closest('.close-btn');
      if(closeBtn){
        const c = closeBtn.dataset.c;
        document.getElementById(`panel-${c}`).classList.remove('open');
        document.querySelector(`.cluster-header[data-c="${c}"] .expand-icon`).style.transform='rotate(0deg)';
        document.querySelector(`.cluster-header[data-c="${c}"]`).setAttribute('aria-expanded','false');
        return;
      }
      const hdr = e.target.closest('.cluster-header');
      if(hdr){
        const c     = hdr.dataset.c;
        const panel = document.getElementById(`panel-${c}`);
        const icon  = hdr.querySelector('.expand-icon');
        const open  = panel.classList.toggle('open');
        icon.style.transform = open ? 'rotate(90deg)' : 'rotate(0deg)';
        hdr.setAttribute('aria-expanded', open);
      }
    });

    listEl.addEventListener('keydown', e => {
      if(e.key==='Enter'||e.key===' '){
        const hdr = e.target.closest('.cluster-header');
        if(hdr) hdr.click();
      }
    });
  })
  .catch(err => {
    document.getElementById('cluster-list').innerHTML =
      `<div style="padding:20px;color:#888;font-size:13px">
        Could not load movie data. Make sure <code>app_data/movies_clustered.csv</code>
        is in the same repo and GitHub Pages is enabled.<br><br><small>${err}</small>
      </div>`;
  });
</script>
</body>
</html>
